function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function openDeleteManager(){
 const data=await backup(),entries=data.entries||{},date=document.querySelector('input[type=date]')?.value||new Date().toISOString().slice(0,10);
 const recordPairs=Object.entries(entries).filter(([k,v])=>k.startsWith('record:')&&v?.date===date),allRecords=Object.entries(entries).filter(([k])=>k.startsWith('record:'));
 const teacherMap=new Map;

 for(const [,r] of allRecords){if(!r?.uid||r.uid==='local-leader')continue;let t=teacherMap.get(r.uid)||{uid:r.uid,name:r.name||'未命名',employee:r.employee||'',count:0};t.count++;teacherMap.set(r.uid,t);}
 document.getElementById('delete-manager')?.remove();
 const wrap=document.createElement('div');wrap.id='delete-manager';wrap.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(15,23,42,.48);display:grid;place-items:center;padding:18px';

 const teachers=[...teacherMap.values()].sort((a,b)=>a.name.localeCompare(b.name,'zh-CN')).map(t=>`<div style="display:grid;grid-template-columns:1fr auto;gap:12px;padding:10px 0;border-bottom:1px solid #eef2f7"><div><strong>${esc(t.name)}</strong> <small>/ ${esc(t.employee)}</small><br><small>共 ${t.count} 条巡堂记录</small></div><button data-del-teacher data-uid="${esc(t.uid)}" data-name="${esc(t.name)}" style="align-self:center">删除老师及全部记录</button></div>`).join('')||'<p style="color:#64748b">暂无老师数据。</p>';
 wrap.innerHTML=`<div style="width:min(860px,96vw);max-height:88vh;overflow:auto;background:#fff;border-radius:16px;box-shadow:0 24px 80px rgba(0,0,0,.22);padding:22px"><div style="display:flex;justify-content:space-between;gap:16px;align-items:center"><div><h2 style="margin:0 0 4px">删除巡堂数据</h2><small style="color:#64748b">腾讯云删除不可撤销，建议先点“导出完整备份”。</small></div><button id="delete-close">关闭</button></div><section style="margin-top:20px;padding:16px;border:1px solid #e7edf5;border-radius:12px"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><div><strong>当前日期：${esc(date)}</strong><br><small>共 ${recordPairs.length} 条记录</small></div><button id="delete-date" style="border-color:#efb4b4;color:#b42318">清空这一天</button></div><div style="margin-top:8px">${records}</div></section><section style="margin-top:16px;padding:16px;border:1px solid #e7edf5;border-radius:12px"><strong>老师数据</strong><p style="margin:4px 0 8px;color:#64748b;font-size:13px">删除老师会同时删除该老师全部日期的巡堂记录与总提交状态。</p>${teachers}</section><section style="margin-top:16px;padding:16px;border:1px solid #fecaca;background:#fff7f7;border-radius:12px"><strong style="color:#b42318">清空全部巡堂数据</strong><p style="margin:4px 0 10px;color:#7f1d1d;font-size:13px">删除所有巡堂记录、总提交状态和所有老师登录资料；课程底册和统计端程序保留。</p><button id="delete-all" style="background:#b42318;color:white;border-color:#b42318">清空全部数据</button></section></div>`;
 document.body.appendChild(wrap);document.getElementById('delete-close').onclick=()=>wrap.remove();wrap.onclick=e=>{if(e.target===wrap)wrap.remove()};
 const refresh=()=>{wrap.remove();location.reload()};
 wrap.querySelectorAll('[data-del-record]').forEach(btn=>btn.onclick=async()=>{if(!confirm('确定删除这一条巡堂记录吗？删除后统计会立即重新计算。'))return;try{await deleteData({mode:'record',date:btn.dataset.date,courseId:btn.dataset.course});refresh()}catch(e){alert('删除失败：'+e.message)}});
 wrap.querySelectorAll('[data-del-teacher]').forEach(btn=>btn.onclick=async()=>{if(!confirm('确定删除“'+btn.dataset.name+'”以及这个老师的全部巡堂记录吗？'))return;try{await deleteData({mode:'teacher',uid:btn.dataset.uid});refresh()}catch(e){alert('删除失败：'+e.message)}});
 document.getElementById('delete-date').onclick=async()=>{if(!confirm('确定清空 '+date+' 的全部巡堂记录和总提交状态吗？'))return;try{await deleteData({mode:'date',date});refresh()}catch(e){alert('删除失败：'+e.message)}};
 document.getElementById('delete-all').onclick=async()=>{const v=prompt('这是危险操作。将删除全部日期的巡堂记录和全部老师资料。\n请输入“清空全部”继续：');if(v!=='清空全部')return;try{await deleteData({mode:'all'});refresh()}catch(e){alert('删除失败：'+e.message)}};
}
function mount(){const bar=document.getElementById('local-tools');if(!bar||document.getElementById('backup-tools'))return;const panel=document.createElement('div');panel.id='backup-tools';panel.style.cssText='margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap';panel.innerHTML='<button id="full-backup">导出完整备份</button><button id="restore-backup">补回备份中缺失的数据</button><button id="csv-all">导出全部明细 CSV（多维表格用）</button><button id="delete-data" style="border-color:#efb4b4;color:#b42318">删除数据</button><span id="backup-status" role="status"></span><input id="backup-file" type="file" accept=".json" hidden>';bar.appendChild(panel);const note=document.createElement('small');note.textContent=window.PATROL_HTML?'HTML版：数据自动保存在当前浏览器。请定期导出完整备份，换电脑、换浏览器或清理数据前必须备份。两个统计端的数据不会自动同步。':'完整备份包含全部日期记录、课程、老师资料和总提交状态；可用于换电脑或恢复数据。删除前建议先导出完整备份。';bar.appendChild(note);
const msg=t=>document.getElementById('backup-status').textContent=t,run=f=>async()=>{try{await f()}catch(e){msg('操作失败：'+e.message)}};
document.getElementById('full-backup').onclick=run(async()=>{download(JSON.stringify(await backup(),null,2),'巡堂完整备份-'+stamp()+'.json','application/json');msg('已发起备份下载，请确认文件已保存到电脑。')});document.getElementById('csv-all').onclick=run(()=>csv('all'));document.getElementById('delete-data').onclick=run(openDeleteManager);const input=document.getElementById('backup-file');document.getElementById('restore-backup').onclick=()=>input.click();input.onchange=run(async()=>{const file=input.files[0];input.value='';if(!file)return;if(file.size>32*1024*1024)throw Error('备份超过32MB，请联系维护人员迁移');const b=JSON.parse(await file.text());window.validatePatrolBackup(b);const n=Object.keys(b.entries).filter(k=>k.startsWith('record:')).length;if(!confirm('备份中有 '+n+' 条记录。本次只补回当前缺失的数据，已有记录（包括草稿）保留，不覆盖、不清空。继续前会保存当前备份，是否继续？'))return;const old=await backup();download(JSON.stringify(old,null,2),'恢复前备份-'+stamp()+'.json','application/json');const r=await fetch('/api/backup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),result=await r.json();if(!r.ok)throw Error(result.error);alert('补充恢复完成：补回 '+result.addedRecords+' 条检查记录，共补充 '+result.added+' 项；已有或不适合恢复的 '+result.skipped+' 项已跳过。现有数据保留。');msg('已补回缺失数据，现有数据保留');document.querySelector('button[aria-label="刷新"]')?.click();});
if(window.PATROL_HTML){bar.querySelector('small').textContent='CSV可用Excel打开；完整备份可恢复全部日期数据。老师通过上方联机码加入。';for(const scope of ['day','month']){const b=document.getElementById('excel-'+scope);b.textContent=scope==='day'?'导出当天 CSV':'导出整月 CSV';b.onclick=run(()=>csv(scope))}const a=document.querySelector('#room-tools a');if(a){a.href='教师联机入口.html';a.textContent='打开教师入口'}document.querySelector('#room-tools small:last-child').textContent='双方需要联网；请保持本统计页面开启。数据保存在当前浏览器，请定期导出完整备份。';}}
document.addEventListener('click',e=>{if(window.PATROL_HTML&&e.target.closest('a')?.getAttribute('href')==='/logout'){e.preventDefault();location.reload();}});
new MutationObserver(mount).observe(document.body,{childList:true,subtree:true});mount();
})();
</script><script>(()=>{'use strict';const C=window.__PATROL_CLOUD,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=t=>{try{return new Date(t).toLocaleString('zh-CN',{hour12:false})}catch{return String(t||'')}},today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());let latest=null,busy=false;function date(){return document.querySelector('input[type=date]')?.value||latest?.date||today()}function modal(title,html){const b=document.createElement('div');b.className='cloud-modal-bg';b.innerHTML=`<section class="cloud-modal"><header><strong>${esc(title)}</strong><button data-close>×</button></header><div>${html}</div></section>`;document.body.append(b);b.querySelector('[data-close]').onclick=()=>b.remove();b.onclick=e=>{if(e.target===b)b.remove()};return b}async function refresh(click=false){if(busy)return;busy=true;try{latest=await C.cloud('dashboard',{date:date()});C.last=latest;status();if(click)document.querySelector('button[aria-label="刷新"]')?.click()}finally{busy=false}}function status(){const b=document.getElementById('cloudbar');if(!b||!latest)return;const t=latest.totals||{};b.querySelector('[data-s]').textContent=`云端正常 · 在线 ${t.online||0} · 今日已加入 ${t.teachers||0} · 巡查记录 ${t.records||0}`;b.querySelector('[data-f]').textContent='问题反馈'+(t.feedbackPending?`（${t.feedbackPending}待回复）`:'')}function people(){const rows=(latest?.teachers||[]).map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.employee)}</td><td>${esc(p.joinCount||1)}</td><td>${p.online?'在线':'离线'}</td><td>${esc(fmt(p.firstJoinAt))}</td><td>${esc(fmt(p.lastSeen))}</td></tr>`).join('');modal('在线 / 已加入教师',`<p>同一老师当天去重；重新进入会累计次数。</p><div style="overflow:auto"><table><thead><tr><th>姓名</th><th>工号</th><th>进入次数</th><th>状态</th><th>首次进入</th><th>最近在线</th></tr></thead><tbody>${rows||'<tr><td colspan="6">暂无</td></tr>'}</tbody></table></div>`)}function feedback(){const rows=latest?.feedback||[],w=modal('教师问题反馈',rows.length?rows.map(r=>`<article class="fb" data-id="${esc(r._id)}"><strong>${esc(r.name)} · ${esc(r.employee)}</strong><small>${esc(fmt(r.createdAt))}</small><p>${esc(r.message)}</p>${r.reply?`<div class="reply">已回复：${esc(r.reply)}</div>`:'<textarea maxlength="2000" placeholder="输入回复…"></textarea><button data-reply>发送回复</button>'}</article>`).join(''):'<p>暂无反馈。</p>');w.querySelectorAll('[data-reply]').forEach(btn=>btn.onclick=async()=>{const a=btn.closest('article'),reply=a.querySelector('textarea').value.trim();if(!reply)return alert('请填写回复');try{await C.cloud('adminReply',{method:'POST',body:{id:a.dataset.id,reply}});w.remove();await refresh(false);feedback()}catch(e){alert('回复失败：'+e.message)}})}function mount(){if(document.getElementById('cloudbar'))return;const b=document.createElement('section');b.id='cloudbar';b.innerHTML='<div><strong>腾讯云统计端 · 正式版</strong><span data-s>正在连接…</span><button data-p>在线 / 已加入</button><button data-f>问题反馈</button><button data-r>立即刷新</button></div><small>统计端可以关闭；老师提交直接进腾讯云，重新打开会恢复全部数据。</small>';document.body.prepend(b);b.querySelector('[data-p]').onclick=people;b.querySelector('[data-f]').onclick=feedback;b.querySelector('[data-r]').onclick=()=>refresh(true);refresh(false).catch(e=>b.querySelector('[data-s]').textContent='云端连接失败：'+e.message)}window.addEventListener('cloud-patrol-data',e=>{latest=e.detail;status()});new MutationObserver(mount).observe(document.body,{childList:true,subtree:true});mount();setInterval(()=>{if(!document.hidden)refresh(false).catch(()=>{})},20000)})();</script></body></html>
